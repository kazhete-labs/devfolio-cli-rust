[package]
name = "devfolio-cli-rust"
version = "0.1.0"
edition = "2021"
description = "Turn a GitHub username into a portfolio site + README scorecard"
license = "MIT"
authors = ["Kazhete Labs"]

[[bin]]
name = "devfolio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
html-escape = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
